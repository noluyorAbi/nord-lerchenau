version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a fresh release: compromised or broken
    # versions are usually yanked within days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      payload:
        patterns: ["payload", "@payloadcms/*"]
      next-react:
        patterns:
          [
            "next",
            "eslint-config-next",
            "react",
            "react-dom",
            "@types/react",
            "@types/react-dom",
          ]
    ignore:
      # Payload pins every @payloadcms package to the same version; bump them
      # together by hand and run the schema check (see docs/RUNBOOK.md).
      - dependency-name: "payload"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@payloadcms/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
