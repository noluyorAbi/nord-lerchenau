name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format · Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # Git hooks are a local developer aid; CI runs the same checks below.
          HUSKY: 0

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      # Frontend pages are prerendered, so the build reads from Postgres. The
      # service container starts empty and Payload skips its Drizzle push under
      # NODE_ENV=production, so the tables have to be created first or every
      # prerender throws.
      - name: Create database schema
        run: bun run db:push-schema
        env:
          DATABASE_URI: postgres://ci:ci@localhost:5432/ci?sslmode=disable
          PAYLOAD_SECRET: ci-secret-ci-secret-ci-secret-ci
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000

      - name: Build
        run: bun run build
        env:
          DATABASE_URI: postgres://ci:ci@localhost:5432/ci?sslmode=disable
          PAYLOAD_SECRET: ci-secret-ci-secret-ci-secret-ci
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          REVALIDATE_SECRET: ci
