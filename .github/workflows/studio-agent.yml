name: AI-Studio agent

# Triggered by POST /repos/<owner>/<repo>/dispatches from /api/agent/enqueue.
# Implements a club change request on an isolated branch, then posts the result
# back to the site. It NEVER merges — the dev merges the branch after review.
on:
  repository_dispatch:
    types: [studio-change-request]

# One run per request; cancel a stale run for the same request.
concurrency:
  group: studio-${{ github.event.client_payload.requestId }}
  cancel-in-progress: true

permissions:
  contents: write # push the studio/* branch (NOT merge — branch protection on main)

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STUDIO_REQUEST_ID: ${{ github.event.client_payload.requestId }}
      STUDIO_PROMPT: ${{ github.event.client_payload.prompt }}
      STUDIO_FEEDBACK: ${{ github.event.client_payload.feedback }}
      # Result file lives OUTSIDE the checkout so `git add -A` never commits it
      # into the studio/* branch.
      STUDIO_RESULT_PATH: ${{ runner.temp }}/studio-result.json
      STUDIO_MAX_COST_USD: ${{ vars.STUDIO_MAX_COST_USD || '8' }}
      # Vercel git-branch preview URL template. Substitute {branch} with the
      # pushed branch name, e.g.
      #   https://nord-lerchenau-git-{branch}-<scope>.vercel.app
      # Leave unset to hold requests at "review" until a preview link is supplied.
      STUDIO_PREVIEW_URL_TEMPLATE: ${{ vars.STUDIO_PREVIEW_URL_TEMPLATE }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Dummy values so payload.config initialises in CI (build never hits the DB:
      # all pages are force-dynamic, so next build does not query Postgres).
      DATABASE_URI: postgres://ci:ci@localhost:5432/ci
      PAYLOAD_SECRET: ci-build-only-secret
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create per-request branch
        id: branch
        run: |
          # Sanitise the request id to digits only — client_payload is untrusted.
          SAFE_ID="$(printf '%s' "$STUDIO_REQUEST_ID" | tr -cd '0-9')"
          [ -z "$SAFE_ID" ] && SAFE_ID="0"
          # Stable, slug-safe branch per request (no slash): the Vercel git-branch
          # preview alias stays deterministic across feedback iterations, and each
          # iteration force-resets it from main. Short enough to avoid Vercel's
          # 63-char subdomain truncation.
          BRANCH="studio-${SAFE_ID}"
          git checkout -B "$BRANCH"
          git config user.name "noluyorAbi"
          git config user.email "121226886+noluyorAbi@users.noreply.github.com"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run agent (implement + gate + review)
        id: agent
        # Exits non-zero on failure/allowlist-violation -> branch is NOT pushed.
        continue-on-error: true
        run: bun run scripts/studio/run-agent.ts

      - name: Commit + push branch (only on success)
        id: push
        if: steps.agent.outcome == 'success'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          # Fixed commit message (no untrusted prompt text). The wish lives in the
          # change-request record; BRANCH is the sanitised branch name.
          git add -A
          git commit \
            -m "studio: ${BRANCH}" \
            -m "Auto-generated change. Review before merge." \
            -m "Claude-Session: AI-Studio agent" \
            || echo "nothing to commit"
          # Force: the branch is reused across feedback iterations, each reset
          # from main. Only this workflow ever writes studio/* branches.
          git push --force origin "$BRANCH"

      - name: Capture preview screenshots
        id: shots
        # Best-effort: waits for the Vercel preview of the pushed commit, then
        # screenshots desktop + mobile and uploads them to Vercel Blob. Runs
        # AFTER the agent, in its own shell the agent never enters (secrets are
        # never exposed to agent-written code). Never fails the run.
        if: steps.push.outcome == 'success' && env.STUDIO_PREVIEW_URL_TEMPLATE != ''
        continue-on-error: true
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          STUDIO_PREVIEW_BYPASS: ${{ secrets.STUDIO_PREVIEW_BYPASS }}
        run: |
          SHA="$(git rev-parse HEAD)"
          PREVIEW_URL="$(node scripts/studio/wait-for-preview.mjs "$SHA")" || exit 0
          [ -z "$PREVIEW_URL" ] && exit 0
          # playwright-core (the API) is a committed devDep; only the chromium
          # binary is installed here, matched to the installed core version.
          bunx playwright@1.61.1 install --with-deps chromium
          PREVIEW_URL="$PREVIEW_URL" \
            bun run scripts/studio/screenshot.ts > "$RUNNER_TEMP/shots.json" || echo '[]' > "$RUNNER_TEMP/shots.json"

      - name: Post result back to the site
        if: always()
        env:
          CALLBACK_URL: ${{ secrets.STUDIO_CALLBACK_URL }}
          STUDIO_SECRET: ${{ secrets.AGENT_WEBHOOK_SECRET }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          PUSHED: ${{ steps.push.outcome }}
          PREVIEW_TEMPLATE: ${{ env.STUDIO_PREVIEW_URL_TEMPLATE }}
        run: |
          if [ ! -f "$STUDIO_RESULT_PATH" ]; then
            echo '{"ok":false,"error":"worker produced no result"}' > "$STUDIO_RESULT_PATH"
          fi
          # Fill branch + a deterministic Vercel git-branch preview URL (from the
          # STUDIO_PREVIEW_URL_TEMPLATE var). If the template is unset or the push
          # failed, previewUrl stays empty and the callback holds the request at
          # "review" rather than asking the club to approve a missing preview.
          node -e '
            const fs=require("fs");
            const r=JSON.parse(fs.readFileSync(process.env.STUDIO_RESULT_PATH,"utf8"));
            r.branch=process.env.BRANCH;
            r.requestId=process.env.STUDIO_REQUEST_ID;
            const pushed = process.env.PUSHED==="success";
            if(!pushed){ r.ok=false; }
            const tpl=process.env.PREVIEW_TEMPLATE||"";
            if(pushed && tpl && process.env.BRANCH){
              r.previewUrl=tpl.split("{branch}").join(process.env.BRANCH);
            }
            // Attach preview screenshots captured by the previous step (if any).
            try {
              const sp = (process.env.RUNNER_TEMP||"") + "/shots.json";
              if (sp && fs.existsSync(sp)) {
                const shots = JSON.parse(fs.readFileSync(sp, "utf8"));
                if (Array.isArray(shots) && shots.length) r.previewShots = shots;
              }
            } catch(e) { /* no shots — fine */ }
            fs.writeFileSync(process.env.STUDIO_RESULT_PATH, JSON.stringify(r));
          '
          curl -sS -X POST "$CALLBACK_URL" \
            -H "x-studio-secret: $STUDIO_SECRET" \
            -H "Content-Type: application/json" \
            --data @"$STUDIO_RESULT_PATH"
